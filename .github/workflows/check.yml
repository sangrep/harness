name: Repository check

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: repository-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Bootstrap immutable artifacts
        run: ./scripts/bootstrap
      - name: Run component acceptance
        shell: bash
        run: |
          source .venv/bin/activate
          started=$SECONDS
          ./scripts/check
          elapsed=$((SECONDS - started))
          printf 'elapsed_seconds=%s\ncache_result=not_enabled\n' "$elapsed"
      - name: Documentation preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-docs-preview
          path: work/docs-site
          retention-days: 7
          if-no-files-found: error
      - name: Wheel and technical receipt
        uses: actions/upload-artifact@v4
        with:
          name: harness-wheel-preview
          path: work/artifacts
          retention-days: 7
          if-no-files-found: error
