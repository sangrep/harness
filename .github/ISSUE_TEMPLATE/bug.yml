name: Bug report
description: Report one reproducible public component bug
title: "bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private material, or security vulnerabilities.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, using public or synthetic inputs only?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include versions and exact public commands.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no secret, private project context, customer material, or vulnerability detail.
          required: true
