name: Publish developer documentation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact accepted current master commit to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: harness-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sangrep/harness' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify selected source and preconfigured destination
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -I scripts/check-pages-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Bootstrap immutable dependencies
        run: ./scripts/bootstrap
      - name: Strict build and public artifact checks
        shell: bash
        run: |
          source .venv/bin/activate
          python scripts/check-docs
          ./scripts/check-gitleaks --docs-artifact
          test ! -e work/docs-site/CNAME
          test ! -L work/docs-site/CNAME
      - name: Package the checked Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: work/docs-site
          retention-days: 1

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sangrep/harness' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck current master and unchanged default destination
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 -I scripts/check-pages-source
      - name: Deploy the checked artifact from this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages
          preview: false
      - name: Verify the reported destination
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: test "$DEPLOYED_PAGE_URL" = 'https://sangrep.github.io/harness/'
