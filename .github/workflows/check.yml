name: Repository check

on:
  pull_request:
    types: [ready_for_review, reopened, synchronize]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: repository-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run governed foundation check
        shell: bash
        run: |
          started=$SECONDS
          ./scripts/check
          elapsed=$((SECONDS - started))
          printf 'elapsed_seconds=%s\ncache_result=not_applicable\n' "$elapsed"
